# Buchungstext-Regeln für CTM Cloud Terminology Management GmbH
# pattern: Regex auf Buchungstext (case-insensitiv) — einfache Anführungszeichen verwenden!
# gegenkonto:  Kontierungsnummer (ZE / Fallback)
# gegenkonto_s: BU bei negativem Umsatz (optional, z. B. 70401 statt 10401)
# kuerzel:     Kurztext im Final-Sheet (Platzhalter: {MM.YYYY} {MM YYYY} {MM} {YYYY} {Q})
# no_prefix:   true  → kein ZA-/ZE-Präfix
# beleg1:      "" = leer | "~auszug" | "~mm" | sonst: fester Wert
# split_re:    true → RE-Nummern splitten; Beträge aus Rechnungs-PDFs (kein Hardcode)
#              (fehlt/ "~source" → parent von source_dir, z. B. Fibu-Monatsordner)
# amount_formula: kst | soli → KSt + 5,5 % SolZ aus Zahlbetrag
rules:
  - pattern: 'Nürnberger Lebensversicherung|NLV LEBENSVERS'
    gegenkonto: "1748"
    kuerzel: "Nürberg. LV {MM} {YYYY}"
    no_prefix: true
    beleg1: ""

  - pattern: 'D\.O\.G\. HOLDING|HOLDING GMBH'
    gegenkonto: "10404"
    kuerzel: "D.O.G. Holding GmbH"

  - pattern: 'D\.O\.G\.|DOG.*Dokumentation'
    gegenkonto: "10401"
    gegenkonto_s: "70401"
    kuerzel: "D.O.G. Dokument GmbH"
    split_re: true

  - pattern: 'Telekom.*Mobilfunk|Mobilfunk Kundenkonto|Telekom Deutschland'
    gegenkonto: "71904"
    kuerzel: "Telekom Deutschland"

  - pattern: 'Klarna.*FROG|Purchase at FROG'
    gegenkonto: "1610"
    kuerzel: "FROG.passion"

  - pattern: 'Klarna.*Kaufland|Purchase at Kaufland'
    gegenkonto: "1610"
    kuerzel: "Kaufland"

  - pattern: 'Klarna'
    gegenkonto: "70105"
    kuerzel: "Avesol GmbH"

  - pattern: 'STRATO'
    gegenkonto: "70104"
    kuerzel: "Strato GmbH"

  - pattern: 'KOERPST|K[oö]rperschaft'
    gegenkonto: "2200"
    kuerzel: "KST VZ Q {Q} {YYYY}"
    no_prefix: true
    beleg1: ""
    fixed_split:
      - gegenkonto: "2200"
        kuerzel: "KST VZ Q {Q} {YYYY}"
        amount_formula: kst
        no_prefix: true
        beleg1: ""
      - gegenkonto: "2208"
        kuerzel: "Solizu KST VZ Q {Q} {YYYY}"
        amount_formula: soli
        no_prefix: true
        beleg1: ""

  - pattern: 'Finanzamt.*LOHNST|LOHNST.*Finanzamt|070/050'
    gegenkonto: "1741"
    kuerzel: "LST Q 1 {YYYY}"
    no_prefix: true
    beleg1: ""

  - pattern: 'ECOVIS|RTS.*Steuerberatung|Steuerberatungsgesell'
    gegenkonto: "71700"
    kuerzel: "RTS Steuerberatungsg"

  - pattern: 'BARMER'
    gegenkonto: "1743"
    kuerzel: "BEK {MM} {YYYY}"
    no_prefix: true
    beleg1: "~auszug"

  - pattern: 'hkk Beitraege|hkk\b'
    gegenkonto: "1743"
    kuerzel: "hkk {MM} {YYYY}"
    no_prefix: true
    beleg1: "~auszug"

  - pattern: 'Knappschaft'
    gegenkonto: "1743"
    kuerzel: "Knappschaft {MM} {YYYY}"
    no_prefix: true
    beleg1: "~auszug"

  - pattern: 'ebase|European Bank.*Verm|Vermögenswirksame'
    gegenkonto: "1750"
    kuerzel: "VL {MM} {YYYY}"
    no_prefix: true
    beleg1: "~auszug"

  - pattern: '\bVL\s+20\d{2}\b|\bVWL\s+20\d{2}\b'
    gegenkonto: "1750"
    kuerzel: "VWL {YYYY}"
    no_prefix: true

  - pattern: 'Ping Zhou'
    gegenkonto: "80500"
    kuerzel: "Ping Zhou"
    split_re: true

  - pattern: 'Xiao Yang-Jacobi.*Gehalt|Gehalt.*Xiao'
    gegenkonto: "1740"
    kuerzel: "Jacobi {MM} {YYYY}"
    no_prefix: true
    beleg1: "~auszug"

  - pattern: 'Francois Massion.*Gehalt|Gehalt.*Massion|Dr\. Francois Massion'
    gegenkonto: "1740"
    kuerzel: "F. Massion {MM} {YYYY}"
    no_prefix: true
    beleg1: "~auszug"

  - pattern: 'Peter Massion.*Gehalt|Lohn.*Peter Massion|Peter Massion'
    gegenkonto: "1740"
    kuerzel: "P. Massion {MM} {YYYY}"
    no_prefix: true
    beleg1: "~auszug"

  - pattern: 'Boris Artes.*Lohn|Lohn.*Boris|Boris Artes'
    gegenkonto: "1740"
    kuerzel: "Boris {MM} {YYYY}"
    no_prefix: true
    beleg1: "~auszug"

  - pattern: 'Larissa Weiss'
    gegenkonto: "1610"
    kuerzel: "Softwareindustrie 24"

  - pattern: 'TX-Kommunikation|TX Servicepauschale'
    gegenkonto: "72402"
    kuerzel: "TX Kommumikations Gm"

  - pattern: 'EBICS'
    gegenkonto: "9 04970"
    kuerzel: "Ebics {MM} {YYYY}"
    no_prefix: true
    beleg1: "~auszug"

  - pattern: 'Entgeltabrechnung|Kontoführung Mindest'
    gegenkonto: "9 04970"
    kuerzel: "Bankgebühr {MM} {YYYY}"
    no_prefix: true
    beleg1: "~auszug"

  - pattern: 'MetaComp'
    gegenkonto: "74850"
    kuerzel: "MetaComp GmbH"

  - pattern: 'RAMTEL12'
    gegenkonto: "10401"
    kuerzel: "Ramtel12 Grundstücks GmbH"

  - pattern: 'Verwaltungs-Berufsgenossenschaft|\bVBG\b'
    gegenkonto: "72100"
    kuerzel: "VBG Beitrag {YYYY}"
    no_prefix: true
    beleg1: ""

  - pattern: 'Rundfunk ARD|Rundfunk.*ZDF'
    gegenkonto: "4380"
    kuerzel: "Rundfunk {MM1} - {MM2} {YYYY2}"
    no_prefix: true
    beleg1: ""

  - pattern: 'IHK'
    gegenkonto: "70901"
    kuerzel: "IHK Beitrag {YYYY}"
    no_prefix: true

  - pattern: 'Dagmar P[aäoö]tzold'
    gegenkonto: "70403"
    kuerzel: "Dagmar Pätzold"

  - pattern: 'B[oö]ttcher'
    gegenkonto: "70201"
    kuerzel: "Böttcher AG"

  - pattern: 'NeS GmbH'
    gegenkonto: "71400"
    kuerzel: "NeS GmbH"

  - pattern: 'Litkiewicz'
    gegenkonto: "71202"
    kuerzel: "Litkiewicz"

  - pattern: 'Tchibo'
    gegenkonto: "1610"
    kuerzel: "Tchibo"

  - pattern: 'Bundesanzeiger'
    gegenkonto: "70205"
    kuerzel: "Bundesanzeiger Verlag"
